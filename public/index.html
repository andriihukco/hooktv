<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOOK TV</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="img/logo-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icons/ios/180.png">

    <script>
        /* Pick light/dark before the first paint so the splash never flashes the wrong theme */
        try{
            var t = localStorage.getItem('interface_theme') || 'system'
            var dark = t == 'dark' || (t == 'system' && (!window.matchMedia || matchMedia('(prefers-color-scheme: dark)').matches))

            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        }
        catch(e){}
    </script>

    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">

    <link rel="stylesheet" href="css/app.css?v=2.84">
</head>
<body>
    <div class="welcome"></div>

    <div id="app">

    </div>
    

    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>
    <script src="http://www.youtube.com/iframe_api" async></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                }
            });
        }
    </script>
    <script src="app.js?v=2.84"></script>
</body>
</html>
