                    <animate attributeName="opacity" from="0.9" to="0" begin="1.85s" dur="0.4s" fill="freeze"/>
                </path>
                <path d="M175.684 44.184V7.074H187.744V44.184H175.684ZM163.444 12.234V1.224H199.954V12.234H163.444Z" fill="#D6FF5C" clip-path="url(#fill-t)"/>
                <!-- V: outline draws, then the liquid fill rises inside it -->
                <path d="M218.977 44.184L202.477 1.224H215.257L222.727 22.494L224.707 28.824H224.977L226.927 22.524L233.947 1.224H246.487L229.867 44.184H218.977Z" pathLength="100" stroke="#D6FF5C" stroke-width="0.9" stroke-dasharray="100" stroke-dashoffset="100" opacity="0.9">
                    <animate attributeName="stroke-dashoffset" from="100" to="0" begin="1.05s" dur="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1"/>
