<svg width="508" height="93" viewBox="0 0 251 46" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- index.html splash on img/logo.svg's artwork. The logo waits in one solid dark gray; a single soft
         band sweeps left to right (eased) and crossfades the dark copy into the real artwork, with a glint
         riding the front, so every part, the faded OO crossing included, fills in the same motion. Then a
         lime spark loops the OO while the app loads. Only gradient stops and visible shapes animate (the
         masks just point at those gradients), which every engine runs. SMIL, because browsers do not run CSS
         animations inside an <img>. Reduced motion shows img/logo.svg instead (index.html) -->
