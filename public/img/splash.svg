                    <animate attributeName="opacity" from="0.9" to="0" begin="1.60s" dur="0.4s" fill="freeze"/>
                </path>
                <path d="M130.25 36.654L130.16 21.744L146.57 1.224H160.55L141.23 23.724L130.25 36.654ZM122.42 44.184V1.224H134.51V44.184H122.42ZM147.59 44.184L135.2 24.984L142.94 15.984L161.72 44.184H147.59Z" fill="white" clip-path="url(#fill-k)"/>
                <!-- T: outline draws, then the liquid fill rises inside it -->
