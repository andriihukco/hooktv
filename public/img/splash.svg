                <g mask="url(#word)">
                    <rect x="-70" y="-6" width="60" height="58" fill="url(#shine)" transform="skewX(-18)">
                        <animate attributeName="x" from="-70" to="290" begin="2.05s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1"/>
                    </rect>
