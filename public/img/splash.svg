                <!-- OO: one stroke that draws itself, second in line -->
                <path d="M82.93 23C82.93 13.61 90.55 6 99.93 6C109.32 6 116.94 13.61 116.94 23C116.94 32.39 109.32 40 99.93 40C90.55 40 82.93 32.39 82.93 23C82.93 13.61 75.32 6 65.93 6C56.55 6 48.93 13.61 48.93 23C48.93 32.39 56.55 40 65.93 40C75.32 40 82.93 32.39 82.93 23Z" pathLength="100" stroke-width="12" stroke-linejoin="round" stroke="white" stroke-dasharray="100" stroke-dashoffset="100">
